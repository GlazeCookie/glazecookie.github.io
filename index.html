<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="饼干屋，一个计算机学生记录学习笔记与技术思考的地方。">
  <meta name="theme-color" content="#f6eee4">
  <title>饼干屋</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" as="image" href="cookie.webp">
</head>
<body>
  <a class="skip-link" href="#top">跳到正文</a>
  <div class="shell">
    <header class="header">
      <a class="brand" href="#top">饼干屋</a>
      <nav class="nav glass" aria-label="主导航">
        <a href="#top">首页</a>
        <a href="#writing">文章</a>
        <a href="#about">关于</a>
      </nav>
    </header>
    <main id="top">
      <div class="intro"><p>你好，欢迎来到饼干屋。</p></div>
      <div class="grid">
        <section class="tile welcome" aria-labelledby="site-title">
          <div class="welcome-copy">
            <h1 id="site-title">饼干屋</h1>
            <p>记录学习中的问题、想法，以及一点一滴的进步。</p>
            <span class="caption">计算机学习笔记与随笔</span>
          </div>
          <img class="cookie" src="cookie.webp" alt="像素曲奇饼干" width="160" height="160" fetchpriority="high">
        </section>
        <section class="tile writing" id="writing" aria-labelledby="writing-title">
          <h2 id="writing-title">最近的文字</h2>
          <div class="entry-label">欢迎来到饼干屋</div>
          <article>
            <h3>从这里开始</h3>
            <p>这里会慢慢装下学习笔记、技术思考，以及值得留住的小事。</p>
          </article>
        </section>
        <div class="about-surface">
          <img class="cookie-behind-glass" src="cookie.webp" alt="" width="160" height="160" loading="lazy" decoding="async">
          <section class="tile about glass" id="about" aria-labelledby="about-title">
            <h2 id="about-title">关于这里</h2>
            <p>一个计算机学生的个人角落。记录正在学习的知识，也记录生活里的片刻。</p>
          </section>
        </div>
      </div>
    </main>
    <footer class="footer">
      <span>© 饼干屋</span>
      <a href="https://github.com/glazecookie">GitHub ↗</a>
    </footer>
  </div>
</body>
</html>
